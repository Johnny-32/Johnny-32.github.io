        <div class="container">
            <a class="navbar-brand" href="#masthead">
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-house"

                        d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z" />
                </svg>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                Menu
                <i class="fas fa-bars ms-1"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav text-uppercase ms-auto py-4 py-lg-0">
                    <li class="nav-item"><a class="nav-link" href="#wyszukiwarka">Wyszukiwarka</a></li>
                    <li class="nav-item"><a class="nav-link" href="#wybrane-miejsca">Wybrane miejsca</a></li>
                    <li class="nav-item"><a class="nav-link" href="planner.html#formularz-sekcja">Formularz</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Masthead-->
    <header class="masthead" id="masthead">
        <div class="container">
            <div class="masthead-subheading">Planer podróży</div>
            <div class="masthead-heading text-uppercase">
                Ta strona pomoże ci wybrać wymarzone wakacje</div>
            <div class="d-flex justify-content-center gap-5">
                <a class="btn btn-primary btn-xl text-uppercase" href="#wyszukiwarka">Wybierz z polecanych miejsc</a>
                <a class="btn btn-primary btn-xl text-uppercase" href="planner.html#formularz-sekcja">
                    Zaplanuj swoją podróż</a>
            </div>
    </header>


    <!-- Wyszukiwarka -->
    <section class="page-section" id="wyszukiwarka">
        <div class="container">
            <div class="text-center">
                <h2 class="section-heading text-uppercase">Wyszukiwarka</h2>
                <h3 class="section-subheading text-muted">Znajdź swoje wymarzone miejsce</h3>
            </div>
            <div class="p-5 border rounded bg-light shadow-sm">
                <form action="" method="GET">
                    <div class="row justify-content-center align-items-end g-3">
                        <div class="col-md-8 text-start">
                            <label for="input-wyszukiwanie" class="form-label fw-bold text-muted">Miejsce:</label>
                            <select id="input-wyszukiwanie" name="input-wyszukiwanie" class="form-select mb-1">
                                <option value="rzym">Rzym</option>
                                <option value="lazurowe-wybrzeze">Lazurowe Wybrzeże</option>
                                <option value="ateny">Ateny</option>
                                <option value="barcelona">Barcelona</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <button type="submit" class="btn btn-primary btn-lg w-100 text-uppercase"
                                id="przycisk-wyszukiwanie">Szukaj</button>
                        </div>
                    </div>
                </form>

                <!-- Carousel -->
                <div id="carousel-kontener" class="carousel slide d-none mt-4 border border-secondary rounded-3 overflow-hidden shadow" data-bs-ride="carousel">
                    <div class="carousel-indicators" id="karuzela-wskazniki"></div>
                    <div class="carousel-inner" id="karuzela-slajdy"></div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carousel-kontener"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Poprzedni</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carousel-kontener"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Następny</span>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Wybrane miejsca-->
    <section class="page-section bg-light" id="wybrane-miejsca">
        <div class="container">
            <div class="text-center">
                <h2 class="section-heading text-uppercase">Wybrane miejsca</h2>
            </div>
            <div class="row justify-content-center mb-3 mt-4">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="text" id="input-filtruj-wyprawy" class="form-control border-start-0 ps-0"
                            placeholder="Szukaj wśród wybranych miejsc..." aria-label="Filtruj wyprawy" />
                    </div>
                </div>
            </div>
            <div class="row justify-content-center mb-5" id="lista-wybranych-miejsc"></div>
            <div class="d-flex justify-content-center">
                <button type="button" class="btn btn-primary btn-md btn-danger text-uppercase"
                    id="usunWszystkieWyprawy">
                    Usuń wszystkie wyprawy
                </button>
            </div>
        </div>
    </section>

    <!-- Footer-->
    <footer class="footer py-4 border-top">
        <div class="container text-center text-secondary small">
            &copy; Jan Głowacki 2026 - Planer podróży
        </div>
    </footer>
